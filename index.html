<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- 拡大ズーム禁止 ＆ 全画面アプリ化設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>しおり</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      /* 連打ダブルタップ拡大を無効化 */
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* 現在の本の名前表示 */
    .current-book-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: #e5e5e5;
      letter-spacing: 1px;
      margin-bottom: 24px;
      max-width: 304px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .container {
      display: flex;
      gap: 24px;
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 140px;
    }

    .btn, .display-box {
      width: 100%;
      height: 80px;
      border: 3px solid #ffffff;
      border-radius: 14px;
      background: transparent;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: bold;
      cursor: pointer;
      outline: none;
    }

    .btn:active {
      transform: scale(0.96);
      background-color: rgba(255, 255, 255, 0.15);
    }

    .display-box input {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      color: #ffffff;
      text-align: center;
      font-size: 2.2rem;
      font-weight: bold;
      outline: none;
    }

    .pos-btn.active {
      background-color: #3b82f6;
      border-color: #3b82f6;
    }

    /* 補助コントロール群 */
    .quick-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
      max-width: 304px;
    }

    .sub-btn {
      padding: 10px 14px;
      border: 1px solid #444;
      border-radius: 10px;
      background-color: #262626;
      color: #cccccc;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
    }

    .sub-btn:active {
      background-color: #383838;
      color: #ffffff;
    }

    /* 本の変更ボタンエリア */
    .book-change-area {
      margin-top: 24px;
      width: 100%;
      max-width: 304px;
    }

    .btn-change-book {
      width: 100%;
      padding: 13px;
      border: 1px solid #555555;
      border-radius: 10px;
      background-color: #262626;
      color: #e5e5e5;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-change-book:active {
      background-color: #383838;
    }

    /* --- モーダル（オーバーレイ） --- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 350px;
      background-color: #222222;
      border: 1px solid #3e3e3e;
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffffff;
    }

    .modal-close-btn {
      background: transparent;
      border: none;
      color: #888888;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 0 6px;
      line-height: 1;
    }

    /* 新規本追加入力フォーム */
    .add-book-form {
      display: flex;
      gap: 8px;
    }

    .add-book-input {
      flex: 1;
      background: #151515;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 10px 12px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
    }

    .add-book-input:focus {
      border-color: #3b82f6;
    }

    .add-book-btn {
      background-color: #3b82f6;
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-weight: bold;
      padding: 0 14px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .add-book-btn:active {
      opacity: 0.85;
    }

    /* 本の一覧リスト */
    .book-list {
      list-style: none;
      max-height: 240px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .book-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background-color: #2c2c2c;
      border: 1px solid #3c3c3c;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .book-item:active {
      background-color: #383838;
    }

    .book-item.selected {
      border-color: #3b82f6;
      background-color: #1e293b;
    }

    .book-info {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
      margin-right: 8px;
    }

    .book-item-name {
      font-size: 0.95rem;
      font-weight: 500;
      color: #ffffff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .badge-selected {
      font-size: 0.7rem;
      background-color: #3b82f6;
      color: #ffffff;
      padding: 2px 7px;
      border-radius: 10px;
      white-space: nowrap;
      font-weight: bold;
      flex-shrink: 0;
    }

    /* 削除ボタン */
    .btn-delete-book {
      background: transparent;
      border: 1px solid #4a4a4a;
      border-radius: 6px;
      color: #ff6b6b;
      font-size: 0.8rem;
      padding: 5px 8px;
      cursor: pointer;
      flex-shrink: 0;
      line-height: 1;
    }

    .btn-delete-book:active:not(:disabled) {
      background-color: rgba(255, 107, 107, 0.2);
    }

    .btn-delete-book:disabled {
      color: #555555;
      border-color: #333333;
      cursor: not-allowed;
      opacity: 0.4;
    }
  </style>
</head>
<body>

  <!-- 現在読書中の本のタイトル -->
  <div class="current-book-title" id="book-title">読書中の本 1</div>

  <div class="container">
    <!-- 左列: ページ操作 -->
    <div class="column">
      <button class="btn" id="btn-up">▲</button>
      <div class="display-box">
        <input type="number" id="page-input" value="1" min="1">
      </div>
      <button class="btn" id="btn-down">▼</button>
    </div>

    <!-- 右列: 位置選択 -->
    <div class="column">
      <button class="btn pos-btn active" data-pos="TOP">TOP</button>
      <button class="btn pos-btn" data-pos="MIDDLE">MIDDLE</button>
      <button class="btn pos-btn" data-pos="BOTTOM">BOTTOM</button>
    </div>
  </div>

  <!-- クイック操作ボタン -->
  <div class="quick-controls">
    <button class="sub-btn" id="btn-minus10">-10</button>
    <button class="sub-btn" id="btn-reset">スタートへ</button>
    <button class="sub-btn" id="btn-plus10">+10</button>
    <button class="sub-btn" id="btn-plus100">+100</button>
  </div>

  <!-- 本の変更ボタン -->
  <div class="book-change-area">
    <button class="btn-change-book" id="btn-open-modal">本の変更</button>
  </div>

  <!-- 本の変更・登録・削除用モーダル -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">本の一覧・切り替え</div>
        <button class="modal-close-btn" id="btn-close-modal">✕</button>
      </div>

      <!-- 本の追加 -->
      <form class="add-book-form" id="add-book-form">
        <input type="text" class="add-book-input" id="new-book-title" placeholder="新しい本のタイトル..." required>
        <button type="submit" class="add-book-btn">追加</button>
      </form>

      <!-- 本リスト -->
      <ul class="book-list" id="book-list"></ul>
    </div>
  </div>

  <script>
    const STORAGE_KEY_BOOKS = 'bm_books_v1';
    const STORAGE_KEY_CURRENT_ID = 'bm_current_book_id';

    // 初期データ
    const defaultBooks = [
      { id: '1', title: '読書中の本 1', page: 1, pos: 'TOP' }
    ];

    let books = JSON.parse(localStorage.getItem(STORAGE_KEY_BOOKS)) || defaultBooks;
    let currentBookId = localStorage.getItem(STORAGE_KEY_CURRENT_ID) || books[0].id;

    // DOM要素
    const bookTitleDisplay = document.getElementById('book-title');
    const pageInput = document.getElementById('page-input');
    const posButtons = document.querySelectorAll('.pos-btn');

    const modalOverlay = document.getElementById('modal-overlay');
    const btnOpenModal = document.getElementById('btn-open-modal');
    const btnCloseModal = document.getElementById('btn-close-modal');
    const bookList = document.getElementById('book-list');
    const addBookForm = document.getElementById('add-book-form');
    const newBookTitle = document.getElementById('new-book-title');

    function getCurrentBook() {
      let book = books.find(b => b.id === currentBookId);
      if (!book) {
        book = books[0];
        currentBookId = book.id;
      }
      return book;
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY_BOOKS, JSON.stringify(books));
      localStorage.setItem(STORAGE_KEY_CURRENT_ID, currentBookId);
    }

    function renderMainView() {
      const book = getCurrentBook();
      bookTitleDisplay.textContent = book.title;
      pageInput.value = book.page;
      posButtons.forEach(b => {
        b.classList.toggle('active', b.dataset.pos === book.pos);
      });
      saveState();
    }

    function renderBookList() {
      bookList.innerHTML = '';
      const canDelete = books.length > 1;

      books.forEach(b => {
        const li = document.createElement('li');
        const isSelected = b.id === currentBookId;
        li.className = `book-item ${isSelected ? 'selected' : ''}`;

        // 本の情報エリア
        const infoDiv = document.createElement('div');
        infoDiv.className = 'book-info';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'book-item-name';
        nameSpan.textContent = b.title;
        infoDiv.appendChild(nameSpan);

        if (isSelected) {
          const badge = document.createElement('span');
          badge.className = 'badge-selected';
          badge.textContent = '選択中';
          infoDiv.appendChild(badge);
        }
        li.appendChild(infoDiv);

        // 削除ボタン
        const delBtn = document.createElement('button');
        delBtn.className = 'btn-delete-book';
        delBtn.textContent = '削除';
        delBtn.disabled = !canDelete;

        delBtn.addEventListener('click', (e) => {
          e.stopPropagation(); // 本の選択イベント発火を防止
          if (books.length <= 1) return;

          // 削除実行
          books = books.filter(item => item.id !== b.id);
          if (currentBookId === b.id) {
            currentBookId = books[0].id;
          }
          saveState();
          renderMainView();
          renderBookList();
        });
        li.appendChild(delBtn);

        // 本選択
        li.addEventListener('click', () => {
          currentBookId = b.id;
          renderMainView();
          modalOverlay.classList.remove('open');
        });

        bookList.appendChild(li);
      });
    }

    function setPage(n) {
      const book = getCurrentBook();
      book.page = Math.max(1, n);
      renderMainView();
    }

    // ページ増減・入力
    document.getElementById('btn-up').addEventListener('click', () => {
      const book = getCurrentBook();
      setPage(book.page + 1);
    });
    document.getElementById('btn-down').addEventListener('click', () => {
      const book = getCurrentBook();
      setPage(book.page - 1);
    });
    pageInput.addEventListener('change', (e) => setPage(parseInt(e.target.value, 10) || 1));

    // 位置切り替え
    posButtons.forEach(b => {
      b.addEventListener('click', () => {
        const book = getCurrentBook();
        book.pos = b.dataset.pos;
        renderMainView();
      });
    });

    // ページ一括増減・リセット
    document.getElementById('btn-plus100').addEventListener('click', () => {
      const book = getCurrentBook();
      setPage(book.page + 100);
    });
    document.getElementById('btn-plus10').addEventListener('click', () => {
      const book = getCurrentBook();
      setPage(book.page + 10);
    });
    document.getElementById('btn-minus10').addEventListener('click', () => {
      const book = getCurrentBook();
      setPage(book.page - 10);
    });
    document.getElementById('btn-reset').addEventListener('click', () => {
      const book = getCurrentBook();
      book.pos = 'TOP';
      setPage(1);
    });

    // モーダル開閉
    btnOpenModal.addEventListener('click', () => {
      renderBookList();
      modalOverlay.classList.add('open');
    });

    btnCloseModal.addEventListener('click', () => {
      modalOverlay.classList.remove('open');
    });

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        modalOverlay.classList.remove('open');
      }
    });

    // 本の追加処理
    addBookForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const title = newBookTitle.value.trim();
      if (!title) return;

      const newBook = {
        id: Date.now().toString(),
        title: title,
        page: 1,
        pos: 'TOP'
      };

      books.push(newBook);
      currentBookId = newBook.id;
      newBookTitle.value = '';

      renderMainView();
      modalOverlay.classList.remove('open');
    });

    // 初期表示
    renderMainView();
  </script>
</body>
</html>
