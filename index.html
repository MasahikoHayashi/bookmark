<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- 拡大ズーム禁止 ＆ 全画面アプリ化設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>しおり</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      /* 連打ダブルタップ拡大を完全に無効化 */
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 {
      font-size: 1.1rem;
      color: #777777;
      letter-spacing: 3px;
      margin-bottom: 24px;
    }

    .container {
      display: flex;
      gap: 24px;
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 140px;
    }

    .btn, .display-box {
      width: 100%;
      height: 80px;
      border: 3px solid #ffffff;
      border-radius: 14px;
      background: transparent;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: bold;
      cursor: pointer;
      outline: none;
    }

    .btn:active {
      transform: scale(0.96);
      background-color: rgba(255, 255, 255, 0.15);
    }

    .display-box input {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      color: #ffffff;
      text-align: center;
      font-size: 2.2rem;
      font-weight: bold;
      outline: none;
    }

    .pos-btn.active {
      background-color: #3b82f6;
      border-color: #3b82f6;
    }

    /* 現在地表示 */
    .status-text {
      margin-top: 28px;
      font-size: 1.1rem;
      color: #999999;
    }

    /* 追加した補助コントロール群 */
    .quick-controls {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }

    .sub-btn {
      padding: 10px 16px;
      border: 1px solid #444;
      border-radius: 10px;
      background-color: #262626;
      color: #cccccc;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
    }

    .sub-btn:active {
      background-color: #383838;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <h1>BOOKMARK</h1>

  <div class="container">
    <!-- 左列: ページ操作 -->
    <div class="column">
      <button class="btn" id="btn-up">▲</button>
      <div class="display-box">
        <input type="number" id="page-input" value="1" min="1">
      </div>
      <button class="btn" id="btn-down">▼</button>
    </div>

    <!-- 右列: 位置選択 -->
    <div class="column">
      <button class="btn pos-btn active" data-pos="TOP">TOP</button>
      <button class="btn pos-btn" data-pos="MIDDLE">MIDDLE</button>
      <button class="btn pos-btn" data-pos="BOTTOM">BOTTOM</button>
    </div>
  </div>

  <div class="status-text" id="status-display">現在地: 1 ページ / TOP</div>

  <!-- クイック操作ボタン -->
  <div class="quick-controls">
    <button class="sub-btn" id="btn-minus10">-10</button>
    <button class="sub-btn" id="btn-reset">スタートへ戻る</button>
    <button class="sub-btn" id="btn-plus10">+10</button>
  </div>

  <script>
    const STORAGE_KEY_PAGE = 'bm_p';
    const STORAGE_KEY_POS = 'bm_pos';

    const pageInput = document.getElementById('page-input');
    const posButtons = document.querySelectorAll('.pos-btn');
    const statusDisplay = document.getElementById('status-display');

    let page = parseInt(localStorage.getItem(STORAGE_KEY_PAGE), 10) || 1;
    let pos = localStorage.getItem(STORAGE_KEY_POS) || 'TOP';

    function update() {
      pageInput.value = page;
      posButtons.forEach(b => {
        b.classList.toggle('active', b.dataset.pos === pos);
      });
      statusDisplay.textContent = `現在地: ${page} ページ / ${pos}`;
      localStorage.setItem(STORAGE_KEY_PAGE, page);
      localStorage.setItem(STORAGE_KEY_POS, pos);
    }

    function setPage(n) {
      page = Math.max(1, n);
      update();
    }

    // 矢印・入力
    document.getElementById('btn-up').addEventListener('click', () => setPage(page + 1));
    document.getElementById('btn-down').addEventListener('click', () => setPage(page - 1));
    pageInput.addEventListener('change', (e) => setPage(parseInt(e.target.value, 10) || 1));

    // 位置切り替え
    posButtons.forEach(b => {
      b.addEventListener('click', () => {
        pos = b.dataset.pos;
        update();
      });
    });

    // 10ページ増減・リセット
    document.getElementById('btn-plus10').addEventListener('click', () => setPage(page + 10));
    document.getElementById('btn-minus10').addEventListener('click', () => setPage(page - 10));
    document.getElementById('btn-reset').addEventListener('click', () => {
      pos = 'TOP';
      setPage(1);
    });

    update();
  </script>
</body>
</html>
